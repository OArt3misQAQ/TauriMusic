<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- TauriMusic 应用图标 · 方案 B「纸面唱片」
       奶油纸底 + 墨色黑胶 + 陶土唱贴 + 细线装裱框 + 纸张颗粒:贴合纸质皮肤。
       全部为手绘几何,无字体无素材引用,不存在版权问题。 -->
  <defs>
    <linearGradient id="disc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c251c"/>
      <stop offset="1" stop-color="#1b1611"/>
    </linearGradient>
    <linearGradient id="label2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8724d"/>
      <stop offset="1" stop-color="#bd5c3c"/>
    </linearGradient>
    <!-- 纸张颗粒:噪点以低透明度覆盖全幅 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 0.33  0 0 0 0.07 0"/>
    </filter>
    <clipPath id="sq"><rect width="1024" height="1024" rx="224"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="#f0eee6"/>
    <rect x="26" y="26" width="972" height="972" rx="200" fill="none" stroke="#2a241c" stroke-opacity="0.3" stroke-width="3"/>
    <circle cx="512" cy="512" r="340" fill="url(#disc2)"/>
    <g fill="none" stroke="#f0eee6" stroke-opacity="0.16" stroke-width="2.5">
      <circle cx="512" cy="512" r="298"/>
      <circle cx="512" cy="512" r="256"/>
      <circle cx="512" cy="512" r="214"/>
    </g>
    <path d="M 207 458 A 310 310 0 0 1 458 207" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="26" stroke-linecap="round"/>
    <circle cx="512" cy="512" r="118" fill="url(#label2)"/>
    <circle cx="512" cy="512" r="20" fill="#f0eee6"/>
    <rect width="1024" height="1024" filter="url(#grain)"/>
  </g>
</svg>
