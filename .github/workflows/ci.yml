name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt + clippy + test, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # tauri.conf.json 声明了 resources/ffmpeg.exe,构建脚本会校验资源存在;
      # CI 只编译测试不运行应用,真包由 Release 工作流下载,这里放占位文件即可
      - name: ffmpeg 资源占位
        run: mkdir -p src-tauri/resources && touch src-tauri/resources/ffmpeg.exe
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 版本一致性(package.json / tauri.conf.json / Cargo.toml)
        run: node scripts/check-version.mjs
      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test

  rust-windows:
    name: Rust (clippy + test, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 同 Linux job:构建脚本校验 resources/ffmpeg.exe 存在,CI 放占位文件即可
      - name: ffmpeg 资源占位
        run: New-Item -ItemType File -Force -Path src-tauri/resources/ffmpeg.exe | Out-Null
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test

  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: 类型检查与构建
        run: npm run build

  android:
    name: Android (debug APK, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装 Android SDK 37 与 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Android 配置虽然清空了 bundle.resources,构建脚本仍会校验默认配置里的 ffmpeg 路径
      - name: ffmpeg 资源占位
        run: mkdir -p src-tauri/resources && touch src-tauri/resources/ffmpeg.exe
      - name: 构建 Android 调试 APK
        run: npm run tauri -- android build --debug --target aarch64
      # debug APK 体积较大:只在 main 推送时保留 3 天,PR 只验证能构建
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: tauri-music-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk
          retention-days: 3
