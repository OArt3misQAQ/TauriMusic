name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: 构建并发布安装包
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 下载 ffmpeg(全格式转码 sidecar,打包为资源)
        run: |
          curl -sL --retry 5 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z e ffmpeg.zip "*/bin/ffmpeg.exe" -o"src-tauri/resources" -y
          rm ffmpeg.zip
          Test-Path src-tauri/resources/ffmpeg.exe
        shell: pwsh
      - name: 构建并发布(NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TauriMusic ${{ github.ref_name }}"
          releaseBody: "Windows 安装包:NSIS(setup.exe)与 MSI 二选一安装。完整变更见对应提交。"
          releaseDraft: false
          prerelease: false
