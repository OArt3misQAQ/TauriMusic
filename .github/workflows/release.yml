name: Release

on:
  push:
    tags: ["v*"]

jobs:
  create-release:
    name: 创建 Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 先建 Release,Windows 与 Android 两个构建 job 才能并行挂产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "TauriMusic ${GITHUB_REF_NAME}" \
            --notes "Windows:NSIS(setup.exe)与 MSI 二选一安装。Android:arm64 APK(签名构建,可直接侧载)。完整变更见对应提交。" \
          || gh release view "${GITHUB_REF_NAME}" --json id -q .id

  build:
    name: 构建并发布安装包
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # LGPL 构建相对 GPL 只少 x264/x265 等视频编码器;应用只用 ffmpeg 做
      # 音频→FLAC 转码,所需音频解码器(ape/wma/wavpack/musepack…)与 flac、
      # png/mjpeg 编解码 LGPL 全都带。固定 n9.0 稳定线,避免 master 滚动引入突变
      - name: 下载 ffmpeg(音频转码 sidecar,打包为资源)
        run: |
          curl -sL --retry 5 -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-9.0.zip
          7z e ffmpeg.zip "*/bin/ffmpeg.exe" -o"src-tauri/resources" -y
          rm ffmpeg.zip
          Test-Path src-tauri/resources/ffmpeg.exe
        shell: pwsh
      # Release 已由 create-release 建好,tauri-action 检测到同名 tag 直接上传产物
      - name: 构建并发布(NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "TauriMusic ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

  android:
    name: 构建 Android APK 并附加到 Release
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: 安装 Android SDK 37 与 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: ffmpeg 资源占位
        run: mkdir -p src-tauri/resources && touch src-tauri/resources/ffmpeg.exe
      # release 变体(非 --debug):R8 按仓库内 proguard-tauri.pro 裁剪,
      # 用 build.gradle.kts 里内置的固定 keystore 签名——跨版本签名一致,
      # 用户可直接覆盖安装升级(CI 现生成的 debug key 每次都不同,必须卸载重装)
      - name: 构建 Android APK(release)
        run: npm run tauri -- android build --target aarch64
      - name: 附加 APK 到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-android
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "dist-android/TauriMusic-${GITHUB_REF_NAME}-android-arm64.apk"
          gh release upload "${GITHUB_REF_NAME}" "dist-android/TauriMusic-${GITHUB_REF_NAME}-android-arm64.apk" --clobber
