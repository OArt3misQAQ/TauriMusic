[package]
name = "tauri-music"
version = "0.7.0"
description = "Apple Music 风格的本地音乐播放器"
authors = ["O_Art3mis"]
edition = "2021"

[lib]
name = "tauri_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rfd = "0.15"
walkdir = "2"
encoding_rs = "0.8"
character_converter = "1"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "gzip"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
mimalloc = "0.1"
sha2 = "0.11"
md5 = "0.7"
base64 = "0.22"
sevenz-rust2 = "0.23.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# SMTC(系统媒体传输控制):Windows 音量弹窗/锁屏/控制中心集成
windows = { version = "0.61", features = ["Foundation", "Media", "Media_Control", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
